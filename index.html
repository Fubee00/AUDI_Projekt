<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NFS MW - Mobile Pro Final</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NEU: Das Warn-Overlay zwingt den User mit dem Bild ins Querformat -->
    <div id="rotate-warning">
        <img src="Handy roatate.png" alt="Bitte ins Querformat drehen" class="rotate-img">
    </div>

    <button id="fs-trigger">FULLSCREEN</button>

    <!-- Linke Seite: NOS-Button -->
    <div class="controls-left">
        <div id="nos-btn">NOS</div>
    </div>

    <!-- Rechte Seite: Das Tacho-Cockpit (Durchsichtig für Touch!) -->
    <div class="hud-right">
        <div class="tacho-box">
            <img src="tacho_bg.png" class="tacho-bg">
            <img src="begrenzer.png" class="redline">
            <img src="TACH_FILL_00.png" class="tacho-fill" id="tacho-fill">

            <img src="gear_and_tempo.png" class="tacho-boxes" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 3; pointer-events: none;">
            
            <img src="turbo_BAR.png" class="turbo-bar" id="turbo-bar">
            <div class="turbo-bar-fill" id="turbo-bar-fill"></div>
            <img src="needle.png" id="needle" class="nadel">
            <img src="turbo_needle.png" id="turbo-needle" class="turbo-needle">
        
            <!-- Digitale Anzeige mit Glas-Fade -->
            <div class="speedo-digital">
                <!-- Gang Anzeige -->
                <span id="gear-val">
                    <span class="gear-bg">8</span>
                    <span id="gear-num">1</span>
                </span>
                
                <!-- FIX: Tempo Anzeige mit Hintergrund-8ern! -->
                <span id="speed-val">
                    <span class="speed-bg">888</span>
                    <span id="speed-num">000</span>
                </span>
            </div>
            
            <span id="speed-unit">MPH</span>

            <div class="turbo-unit">
                <img src="turb_bg.png" class="turbo-bg-img">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
